name: Web

on:
  pull_request:
    branches: [main]
    paths: [web/**, .github/workflows/web.yml]
  push:
    branches: [main]
    tags: ['v*']
    paths: [web/**, .github/workflows/web.yml]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: web
          target: validate
          build-args: APP_ENV=production
          secrets: npm_token=${{ secrets.PACKAGES_TOKEN }}
          push: false
          cache-from: type=gha,scope=l2-studio-web
          cache-to: type=gha,mode=max,scope=l2-studio-web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:e2e

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/podvysotskyi/l2-studio
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: web
          target: production
          build-args: APP_ENV=production
          secrets: npm_token=${{ secrets.PACKAGES_TOKEN }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=l2-studio-web
          cache-to: type=gha,mode=max,scope=l2-studio-web
