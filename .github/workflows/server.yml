name: Server

on:
  pull_request:
    branches: [main]
    paths: [server/**, global.json, .dockerignore, compose.yaml, .github/workflows/server.yml]
  push:
    branches: [main]
    tags: ['v*']
    paths: [server/**, global.json, .dockerignore, compose.yaml, .github/workflows/server.yml]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run server tests against PostgreSQL
        run: docker compose --profile test run --rm server-tests
      - name: Build production hosts
        run: |
          docker build --target api-production --tag l2-studio-api-validate --file server/Dockerfile .
          docker build --target worker-production --tag l2-studio-worker-validate --file server/Dockerfile .

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api-production
            image: l2-studio-api
          - target: worker-production
            image: l2-studio-worker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/podvysotskyi/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
