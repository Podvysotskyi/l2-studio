name: Compose

on:
  pull_request:
    branches: [main]
    paths: [compose.yaml, server/Dockerfile, web/Dockerfile, docker/**, .dockerignore, .github/workflows/compose.yml]
  push:
    branches: [main]
    paths: [compose.yaml, server/Dockerfile, web/Dockerfile, docker/**, .dockerignore, .github/workflows/compose.yml]
  workflow_dispatch:

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose model
        run: docker compose config
      - name: Build Compose images
        run: docker compose build
