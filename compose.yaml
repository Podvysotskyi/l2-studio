name: l2-studio

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: l2-studio
      POSTGRES_USER: l2
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U l2 -d l2-studio']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres-test:
    profiles: [test]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: l2-studio-test
      POSTGRES_USER: l2_test
      POSTGRES_PASSWORD: test-secret
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U l2_test -d l2-studio-test']
      interval: 3s
      timeout: 3s
      retries: 30

  studio-api:
    image: ${L2_STUDIO_API_IMAGE:-l2-studio-api:dev}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api-production
    environment:
      DOTNET_ENVIRONMENT: Development
    volumes:
      - assets-data:/workspace/assets:ro
      - ${L2_SOURCE_PATH:-../sources}:/workspace/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep --quiet "^HTTP/1.1 200" <&3'
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  preview-browser:
    image: ${L2_STUDIO_PREVIEW_IMAGE:-l2-studio-preview-browser:dev}
    build:
      context: .
      dockerfile: docker/preview-browser/Dockerfile
    init: true
    cap_add: [SYS_ADMIN]
    shm_size: 1gb
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9222/json/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  studio-worker:
    image: ${L2_STUDIO_WORKER_IMAGE:-l2-studio-worker:dev}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: worker-production
    environment:
      DOTNET_ENVIRONMENT: Development
    volumes:
      - assets-data:/workspace/assets
      - ${L2_SOURCE_PATH:-../sources}:/workspace/sources:ro
    depends_on:
      preview-browser:
        condition: service_healthy
      studio-api:
        condition: service_healthy
      studio:
        condition: service_started
    restart: unless-stopped

  server-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: server/Dockerfile
      target: server-tests
    environment:
      L2_STUDIO_TEST_POSTGRES: Host=postgres-test;Port=5432;Database=l2-studio-test;Username=l2_test;Password=test-secret
    depends_on:
      postgres-test:
        condition: service_healthy

  asset-server:
    image: nginx:1.29-alpine
    ports:
      - '127.0.0.1:${STUDIO_ASSET_PORT:-5300}:80'
    volumes:
      - assets-data:/srv/assets:ro
      - ./docker/asset-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  studio:
    image: ${L2_STUDIO_IMAGE:-l2-studio:dev}
    build:
      context: ./web
      target: development
      args:
        APP_ENV: development
    environment:
      NODE_ENV: development
    init: true
    ports:
      - '127.0.0.1:${STUDIO_WEB_PORT:-3001}:3001'
    depends_on:
      studio-api:
        condition: service_healthy
      asset-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  assets-data:
  postgres-data:
