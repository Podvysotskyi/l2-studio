name: l2-studio

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-l2web};Username=${POSTGRES_USER:-l2web};Password=${POSTGRES_PASSWORD:-l2web_dev}

x-asset-environment: &asset-environment
  AssetImport__SystemTexturesSourcePath: /workspace/sources/Interlude/systextures
  AssetImport__TexturesSourcePath: /workspace/sources/Interlude/textures
  AssetImport__MusicSourcePath: /workspace/sources/Interlude/music
  AssetImport__SoundsSourcePath: /workspace/sources/Interlude/sounds
  AssetImport__StaticMeshesSourcePath: /workspace/sources/Interlude/staticmeshes
  AssetImport__LevelsSourcePath: /workspace/sources/Interlude/maps
  AssetImport__AssetRootPath: /workspace/assets

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-l2web}
      POSTGRES_USER: ${POSTGRES_USER:-l2web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-l2web_dev}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  studio-api:
    image: ${L2_STUDIO_API_IMAGE:-l2-studio-api:dev}
    build:
      context: ${L2_STUDIO_ROOT:-.}
      dockerfile: docker/dotnet.Dockerfile
      args:
        PROJECT: server/L2.Studio.Api/L2.Studio.Api.csproj
    command: ['L2.Studio.Api.dll']
    environment:
      <<: [*dotnet-environment, *asset-environment]
    ports: ['127.0.0.1:5101:8080']
    volumes:
      - ${L2_STUDIO_ROOT:-.}/assets:/workspace/assets:ro
      - ${L2_SOURCE_PATH:-../sources}:/workspace/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  studio-worker:
    image: ${L2_STUDIO_WORKER_IMAGE:-l2-studio-worker:dev}
    build:
      context: ${L2_STUDIO_ROOT:-.}
      dockerfile: docker/studio-worker.Dockerfile
    command: ['L2.Studio.Worker.dll']
    environment:
      <<: [*dotnet-environment, *asset-environment]
      AssetImport__StudioBaseUrl: http://studio:3001
      AssetImport__LevelPreviewBrowserUrl: http://puppeteer:9222
    volumes:
      - ${L2_STUDIO_ROOT:-.}/assets:/workspace/assets
      - ${L2_SOURCE_PATH:-../sources}:/workspace/sources:ro
    depends_on:
      puppeteer:
        condition: service_healthy
      studio-api:
        condition: service_healthy
      studio:
        condition: service_started
    restart: unless-stopped

  puppeteer:
    image: ${L2_PUPPETEER_IMAGE:-l2-studio-puppeteer:dev}
    build:
      context: ${L2_STUDIO_ROOT:-.}
      dockerfile: docker/puppeteer.Dockerfile
    init: true
    cap_add: [SYS_ADMIN]
    shm_size: 1gb
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9222/json/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  studio:
    image: ${L2_STUDIO_IMAGE:-l2-studio:dev}
    build:
      context: ${L2_STUDIO_ROOT:-.}/web
      secrets: [npm_token]
    ports: ['127.0.0.1:3001:3001']
    environment:
      NUXT_PUBLIC_STUDIO_API_BASE: ${NUXT_PUBLIC_STUDIO_API_BASE:-http://localhost:5101}
      NUXT_PUBLIC_ASSET_BASE_URL: ${NUXT_PUBLIC_ASSET_BASE_URL:-http://localhost:5300}
    depends_on:
      studio-api:
        condition: service_healthy
      asset-server:
        condition: service_healthy
    restart: unless-stopped

  asset-server:
    image: nginx:1.29-alpine
    ports: ['127.0.0.1:5300:80']
    volumes:
      - ${L2_STUDIO_ROOT:-.}/assets:/srv/assets:ro
      - ${L2_STUDIO_ROOT:-.}/docker/nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
