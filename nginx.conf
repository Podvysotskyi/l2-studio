server {
    listen 80;
    server_name _;
    root /srv/assets;

    location = /health/live {
        default_type text/plain;
        return 200 'ok\n';
    }

    location /releases/ {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Cache-Control 'no-cache' always;
        try_files $uri =404;
    }
}
